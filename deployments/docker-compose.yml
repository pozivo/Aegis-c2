services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?Set AEGIS_DB_PASSWORD for the local lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  control-plane:
    build:
      context: ../control-plane
    environment:
      AEGIS_DATABASE_URL: postgres://aegis:${AEGIS_DB_PASSWORD:?Set AEGIS_DB_PASSWORD for the local lab}@postgres:5432/aegis?sslmode=disable
      AEGIS_OPERATOR_TOKEN: ${AEGIS_OPERATOR_TOKEN:?Set AEGIS_OPERATOR_TOKEN to a random 32-character minimum value}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
